<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <script>
        function greet()
        {
            let name = document.querySelector('#name').value;
            alert('Hello, ' + name)
        }
    </script>
</head>
<body>
    <form onsubmit="greet(); return false;">
        <input type="text" autocomplete="off" autofocus id="name" name="name" placeholder="Name">
        <input type="submit">
    </form>
</body>
</html>
