<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
</head>
<body>
    <form>
        <input type="text" autocomplete="off" autofocus id="name" name="name" placeholder="Name">
        <input type="submit">
    </form>
    <script>
        function greed(event){
            let name = document.querySelector('#name').value;
            alert('Hello, ' + name);
            event.preventDefault();
        }

        let form = document.querySelector('form')
        form.addEventListener('submit', greed);
    </script>
</body>
</html>
