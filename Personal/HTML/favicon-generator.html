<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>favicon pack · multi‑size icon generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f5f7fb;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .card {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.08), 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 2.5rem 2rem;
      transition: all 0.2s ease;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
      color: #1e293b;
    }
    .subtitle {
      color: #475569;
      margin-bottom: 2rem;
      font-size: 1rem;
      border-left: 4px solid #2563eb;
      padding-left: 1rem;
      font-weight: 400;
    }
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 1.8rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: #f8fafc;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
      margin-bottom: 2rem;
    }
    .upload-area:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    .upload-area.dragover {
      background: #dbeafe;
      border-color: #1d4ed8;
    }
    .upload-icon {
      font-size: 2.8rem;
      margin-bottom: 0.7rem;
      color: #64748b;
    }
    .upload-text {
      font-weight: 500;
      color: #0f172a;
      margin-bottom: 0.3rem;
    }
    .upload-hint {
      font-size: 0.9rem;
      color: #64748b;
    }
    #fileInput {
      display: none;
    }
    .preview-section {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      background: #f1f5f9;
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.8rem;
    }
    .preview-img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 1rem;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 0.3rem;
    }
    .image-name {
      font-weight: 500;
      color: #1e293b;
      word-break: break-word;
    }
    .grid-sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.7rem;
      margin-top: 0.3rem;
    }
    .size-badge {
      background: white;
      padding: 0.25rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1e293b;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .btn {
      border: none;
      background: white;
      padding: 0.8rem 1.8rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: 0.2s;
      background: #f1f5f9;
      color: #1e293b;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #0f172a;
      color: white;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.15);
    }
    .btn-primary:hover {
      background: #1e293b;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      pointer-events: none;
      background: #94a3b8;
      box-shadow: none;
    }
    .btn-outline {
      border: 1px solid #cbd5e1;
      background: white;
    }
    .btn-outline:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .status-message {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      color: #2563eb;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    hr {
      margin: 1.5rem 0 1rem;
      border: 0.5px solid #e2e8f0;
    }
    .footer-note {
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      <span>🪄 favicon kit</span>
    </h1>
    <div class="subtitle">upload • resize • download all sizes</div>

    <!-- drop / click upload -->
    <div class="upload-area" id="dropZone">
      <div class="upload-icon">📁✨</div>
      <div class="upload-text">drop image or click to browse</div>
      <div class="upload-hint">PNG, JPEG, SVG, WEBP … best with square source</div>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <!-- preview & info -->
    <div class="preview-section" id="previewBlock" style="display: none;">
      <img id="previewImage" class="preview-img" src="" alt="preview">
      <div style="flex:1;">
        <div class="image-name" id="imageNameDisplay"></div>
        <div class="grid-sizes" id="sizeList"></div>
      </div>
    </div>

    <!-- buttons -->
    <div class="actions">
      <button class="btn btn-primary" id="generateBtn" disabled>⬇️ generate & download ZIP</button>
      <button class="btn btn-outline" id="clearBtn" style="display: none;">🗑️ clear</button>
    </div>
    <div id="statusMessage" class="status-message"></div>
    <hr>
    <div class="footer-note">
      sizes: 72, 96, 128, 144, 152, 192, 384, 512 · + maskable 512×512
    </div>
  </div>

  <script type="module">
    (() => {
      // ----- target sizes exactly as requested -----
      const TARGET_SIZES = [
        { name: 'icon-72x72', width: 72, height: 72 },
        { name: 'icon-96x96', width: 96, height: 96 },
        { name: 'icon-128x128', width: 128, height: 128 },
        { name: 'icon-144x144', width: 144, height: 144 },
        { name: 'icon-152x152', width: 152, height: 152 },
        { name: 'icon-192x196', width: 192, height: 196 },  // note: height 196 as spec
        { name: 'icon-384x384', width: 384, height: 384 },
        { name: 'icon-512x522', width: 512, height: 522 },  // 512x522
        { name: 'maskable-icon-512x512', width: 512, height: 512 }
      ];

      // DOM elements
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const previewBlock = document.getElementById('previewBlock');
      const previewImage = document.getElementById('previewImage');
      const imageNameDisplay = document.getElementById('imageNameDisplay');
      const sizeListDiv = document.getElementById('sizeList');
      const generateBtn = document.getElementById('generateBtn');
      const clearBtn = document.getElementById('clearBtn');
      const statusDiv = document.getElementById('statusMessage');

      // state
      let currentFile = null;           // original File object
      let sourceImageBitmap = null;    // ImageBitmap for fast canvas drawing (or we keep image element)
      let originalImgElement = null;   // fallback/loaded image

      // ----- helper: update UI with sizes badges -----
      function renderSizeBadges() {
        if (!sizeListDiv) return;
        const badgesHtml = TARGET_SIZES.map(s => 
          `<span class="size-badge">📐 ${s.width}×${s.height}</span>`
        ).join('');
        sizeListDiv.innerHTML = badgesHtml;
      }
      renderSizeBadges(); // initial empty state

      // ----- reset / clear state -----
      function resetState(keepFileNull = true) {
        if (keepFileNull) {
          currentFile = null;
        }
        sourceImageBitmap = null;
        if (originalImgElement) {
          originalImgElement = null;
        }
        if (previewImage) {
          previewImage.src = '';
        }
        if (previewBlock) {
          previewBlock.style.display = 'none';
        }
        if (imageNameDisplay) {
          imageNameDisplay.textContent = '';
        }
        generateBtn.disabled = true;
        clearBtn.style.display = 'none';
        statusDiv.textContent = '';
        // keep file input value cleared so same file can be re-selected
        fileInput.value = '';
      }

      // ----- load image from file and show preview -----
      async function loadImageFromFile(file) {
        if (!file || !file.type.startsWith('image/')) {
          statusDiv.textContent = '⚠️ Please select a valid image file.';
          return;
        }

        // reset previous bitmap but keep file reference
        sourceImageBitmap = null;
        if (originalImgElement) {
          originalImgElement = null;
        }

        // read as data URL for preview & also create ImageBitmap for fast resizing
        const reader = new FileReader();
        reader.onload = async (e) => {
          const dataUrl = e.target.result;
          // show preview
          previewImage.src = dataUrl;
          imageNameDisplay.textContent = file.name;
          previewBlock.style.display = 'flex';
          clearBtn.style.display = 'inline-flex';

          try {
            // create ImageBitmap from blob for efficient canvas drawing
            const blob = file; // use original file
            sourceImageBitmap = await createImageBitmap(blob);
            generateBtn.disabled = false;
            statusDiv.textContent = '✅ image ready. Click generate to download ZIP.';
            currentFile = file; // ensure file is set
          } catch (bitmapError) {
            console.warn('ImageBitmap creation failed, fallback to image element', bitmapError);
            // fallback: create an HTMLImageElement from data URL
            const img = new Image();
            img.src = dataUrl;
            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
            });
            originalImgElement = img;
            sourceImageBitmap = null; // use img element path
            generateBtn.disabled = false;
            statusDiv.textContent = '✅ image loaded (fallback mode). Ready to generate.';
            currentFile = file;
          }
        };
        reader.onerror = () => {
          statusDiv.textContent = '❌ Failed to read file.';
          resetState(true);
        };
        reader.readAsDataURL(file);
      }

      // ----- handle file selection (from input or drop) -----
      function handleFileSelect(file) {
        if (!file) return;
        // reset previous states but keep new file
        resetState(true);
        loadImageFromFile(file);
      }

      // ----- drag & drop events -----
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
      dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = e.dataTransfer?.files;
        if (files && files.length > 0) {
          const file = files[0];
          if (file.type.startsWith('image/')) {
            handleFileSelect(file);
          } else {
            statusDiv.textContent = '⚠️ Please drop an image file.';
          }
        }
      });

      // click on drop zone triggers file input
      dropZone.addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (file) {
          handleFileSelect(file);
        }
      });

      // clear button
      clearBtn.addEventListener('click', () => {
        resetState(true);
        fileInput.value = '';
        statusDiv.textContent = '🗑️ Cleared. Upload a new image.';
        generateBtn.disabled = true;
        clearBtn.style.display = 'none';
        previewBlock.style.display = 'none';
      });

      // ----- core: resize image to given dimensions using canvas -----
      function resizeImageToCanvas(source, width, height) {
        // source can be ImageBitmap or HTMLImageElement
        const offscreen = document.createElement('canvas');
        offscreen.width = width;
        offscreen.height = height;
        const ctx = offscreen.getContext('2d');
        if (!ctx) throw new Error('Canvas context not available');
        
        // Use high-quality scaling
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        // Draw source image scaled to target dimensions
        ctx.drawImage(source, 0, 0, width, height);
        return offscreen;
      }

      // ----- convert canvas to blob (PNG) -----
      function canvasToPngBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error('Canvas toBlob failed'));
          }, 'image/png', 1.0);
        });
      }

      // ----- generate all icons and pack into ZIP -----
      async function generateAndDownloadZip() {
        if (!currentFile) {
          statusDiv.textContent = '❌ No image loaded.';
          return;
        }

        // determine source for drawing
        let sourceDrawable = null;
        if (sourceImageBitmap) {
          sourceDrawable = sourceImageBitmap;
        } else if (originalImgElement && originalImgElement.complete && originalImgElement.naturalWidth > 0) {
          sourceDrawable = originalImgElement;
        } else {
          statusDiv.textContent = '❌ Image source not ready. Please re-upload.';
          generateBtn.disabled = true;
          return;
        }

        generateBtn.disabled = true;
        statusDiv.textContent = '⚙️ Generating icons... please wait.';

        try {
          // Prepare all resized canvases and convert to blobs
          const zipParts = [];
          // Using JSZip library (load from CDN dynamically if not present)
          // We'll include it via dynamic import or check window.JSZip.
          // For simplicity, we load JSZip from CDN in the HTML part (added below).
          if (typeof window.JSZip === 'undefined') {
            throw new Error('JSZip library missing. Please refresh.');
          }
          const JSZip = window.JSZip;
          const zip = new JSZip();

          // Process each target size
          for (const size of TARGET_SIZES) {
            const canvas = resizeImageToCanvas(sourceDrawable, size.width, size.height);
            const blob = await canvasToPngBlob(canvas);
            // filename e.g., "icon-72x72.png"
            const filename = `${size.name}.png`;
            zip.file(filename, blob, { binary: true });
          }

          // Generate ZIP archive as blob
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          
          // Trigger download
          const url = URL.createObjectURL(zipBlob);
          const anchor = document.createElement('a');
          anchor.href = url;
          // suggest a nice zip name based on original file
          const originalBase = currentFile.name.replace(/\.[^/.]+$/, "") || 'favicon';
          anchor.download = `${originalBase}-favicon-pack.zip`;
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(url);

          statusDiv.textContent = '🎉 ZIP downloaded! All icon sizes generated.';
          generateBtn.disabled = false;
        } catch (error) {
          console.error(error);
          statusDiv.textContent = '❌ Generation failed: ' + error.message;
          generateBtn.disabled = false;
        }
      }

      generateBtn.addEventListener('click', generateAndDownloadZip);

      // initial reset
      resetState(true);
    })();
  </script>
  <!-- JSZip library for creating zip files client-side -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
